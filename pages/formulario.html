<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Medtrack</title>

<!-- Ícone da aba -->
<link rel="shortcut icon" href="../imagens/logo-escuro.svg" type="image/x-icon">

<!-- Bootstrap 5.3.8 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- Seu CSS -->
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/daltonismo.css">
<script src="../js/daltonismo.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
<main class="d-flex align-items-center justify-content-center min-vh-100">
<!-- Container principal -->
<section class="container-login d-flex flex-wrap shadow rounded overflow-hidden">

<!-- Coluna formulário -->
<div class="container-form position-relative col-12 col-md-6 p-4">

<!-- Botão modo escuro -->
<a href="#" id="dark-mode-toggle"
class="theme-toggle btn btn-sm rounded-circle d-flex align-items-center justify-content-center">
<i class="fa-solid fa-moon"></i>
</a>

<!-- Botão voltar -->
<a class="seta btn btn-sm d-flex align-items-center justify-content-center" href="../pages/home.html">
<i class="fa-solid fa-arrow-left"></i>
</a>

<!-- Título -->
<h1 class="text-center title-form mt-5">Preencha o Formulário</h1>
<p class="texto text-center">Seu espaço para cuidar da saúde.</p>

<!-- Formulário -->

<!-- Formulário -->
<form class="login-form" method="post" action="/Formulario/EnviarFormulario">

  <!-- Dados Pessoais -->
  <details class="mb-3" open>
    <summary class="summary">Dados Pessoais</summary>
    <div class="mt-2">
      <div class="mb-2">
        <label for="nome" class="form-label">Nome Completo <span class="text-danger">*</span></label>
        <input type="text" id="nome" name="Nome" class="form-control" placeholder="Digite seu nome completo">
      </div>

      <div class="mb-2">
        <label for="cpf" class="form-label">CPF <span class="text-danger">*</span></label>
        <input type="text" id="cpf" name="CPF" class="form-control" placeholder="Digite seu CPF com 11 dígitos">
      </div>

      <div class="mb-2">
        <label for="dataNascimento" class="form-label">Data de Nascimento <span class="text-danger">*</span></label>
        <input type="date" id="dataNascimento" name="DataNascimento" class="form-control">
      </div>

      <div class="mb-2">
        <label for="sexo" class="form-label">Sexo <span class="text-danger">*</span></label>
        <select class="form-select" id="sexo" name="Sexo" data-bs-toggle="tooltip" title="Escolha a opção correta para registros médicos">
          <option value="" disabled selected>Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="row g-3 mb-2">
        <div class="col-md-6">
          <label for="altura" class="form-label">Altura (m) <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="altura" name="Altura" placeholder="Ex: 1,75">
        </div>
        <div class="col-md-6">
          <label for="peso" class="form-label">Peso (kg) <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="peso" name="Peso" placeholder="Ex: 70">
        </div>
      </div>

      <div class="mb-2">
        <label for="tipo-sanguineo" class="form-label">Tipo Sanguíneo <span class="text-danger">*</span></label>
        <select class="form-select" id="tipo-sanguineo" name="TipoSanguineo" data-bs-toggle="tooltip" title="Escolha corretamente para registros médicos">
          <option value="" disabled selected>Selecione</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <div class="mb-2">
        <label for="sus" class="form-label">Cartão SUS <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="sus" name="SUS" placeholder="Digite o número do cartão SUS">
      </div>
    </div>
  </details>

  <!-- Contato de Emergência -->
  <details class="mb-3">
    <summary class="summary">Contato de Emergência</summary>
    <div class="mt-2">
      <div class="mb-2">
        <label for="nomeContato" class="form-label">Nome <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="nomeContato" name="NomeContato" placeholder="Digite o nome do contato">
      </div>
      <div class="mb-2">
        <label for="telefoneContato" class="form-label">Telefone <span class="text-danger">*</span></label>
        <input type="tel" class="form-control" id="telefoneContato" name="TelefoneContato" placeholder="(00) 00000-0000">
      </div>
      <div class="mb-2">
        <label for="relacionamento" class="form-label">Relacionamento <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="relacionamento" name="Relacionamento" placeholder="Ex: Mãe, Primo, Tio...">
      </div>
    </div>
  </details>

  <!-- Medicamentos -->
  <details class="mb-3">
    <summary class="summary">Medicamentos</summary>
    <div class="mt-2">
      <div class="mb-2">
        <label for="medicamento" class="form-label">Nome do Medicamento</label>
        <input type="text" class="form-control" id="medicamento" name="Medicamento" placeholder="Ex: Paracetamol">
      </div>
      <div class="mb-2">
        <label for="dosagem" class="form-label">Dosagem</label>
        <input type="text" class="form-control" id="dosagem" name="Dosagem" placeholder="Ex: 500mg">
      </div>
      <div class="mb-2">
        <label for="frequencia" class="form-label">Frequência</label>
        <input type="text" class="form-control" id="frequencia" name="Frequencia" placeholder="Ex: 2x/dia">
      </div>
    </div>
  </details>

  <div class="mt-2">
    <label for="observacoes" class="form-label">Observações</label>
    <textarea class="form-control" id="observacoes" name="Observacoes" rows="4" placeholder="Ex: alergias, restrições ou informações importantes"></textarea>
  </div>

  <!-- Botão enviar -->
  <button type="submit" class="btn w-100">Cadastrar</button>
</form>

</form>
</div>
</section>

<!-- VLibras -->
<div vw class="enabled">
<div vw-access-button class="active"></div>
<div vw-plugin-wrapper>
<div class="vw-plugin-top-wrapper"></div>
</div>
</div>
</main>

<!-- Script modo escuro -->
<script src="../js/modo-escuro.js"></script>
<script src="../js/validacao-form.js"></script>
<script src="../js/font-size.js"></script>


<!-- VLibras -->
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
</body>
</html>
