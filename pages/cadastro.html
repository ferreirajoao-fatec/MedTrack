<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Medtrack</title>

<!-- Ícone da aba -->
<link rel="shortcut icon" href="../imagens/logo-escuro.svg" type="image/x-icon">

<!-- Bootstrap 5.3.8 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- Seu CSS -->
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/daltonismo.css">
<script src="../js/daltonismo.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>
<main class="d-flex align-items-center justify-content-center min-vh-100" role="main">

    
<!-- Container principal -->
<section class="container-login d-flex flex-wrap shadow rounded overflow-hidden" role="region" aria-label="Formulário de cadastro">

<!-- Coluna imagem -->
<div class="container-imagem d-flex align-items-center justify-content-center p-3 col-12 col-md-6" role="img" aria-label="Ilustração de página de cadastro Medtrack">
<img src="../imagens/imagem-header-cadastro.svg" alt="Ilustração de página de cadastro Medtrack"
class="img-fluid rounded" title="Cadastro Medtrack">
</div>

<!-- Coluna formulário -->
<div class="container-form position-relative col-12 col-md-6 p-4">

<!-- Botão modo escuro -->
<a href="#" id="dark-mode-toggle"
class="theme-toggle btn btn-sm rounded-circle d-flex align-items-center justify-content-center"
title="Ativar/desativar modo escuro" aria-label="Ativar ou desativar modo escuro">
<i class="fa-solid fa-moon" aria-hidden="true"></i>
</a>

<!-- Botão voltar -->
<a class="seta btn btn-sm d-flex align-items-center justify-content-center" href="../pages/home.html"
title="Voltar para a página inicial" aria-label="Voltar para página inicial">
<i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
</a>

<!-- Título -->
<h1 class="text-center title-form mt-5">FAÇA SEU CADASTRO</h1>
<p class="texto text-center">Seu espaço para cuidar da saúde.</p>

<!-- Formulário -->
<form class="login-form" novalidate role="form" aria-label="Formulário de cadastro de usuário">

<div class="mb-2">
<label for="nome" class="form-label">Nome Completo: <span class="text-danger">*</span></label>
<input type="text" id="nome" name="nome" class="form-control"
placeholder="Digite o seu nome completo." required title="Digite o seu nome completo" aria-label="Nome completo">
</div>

<div class="mb-2">
<label for="cpf" class="form-label">CPF: <span class="text-danger">*</span></label>
<input type="text" id="cpf" name="cpf" class="form-control" placeholder="Digite o seu CPF."
required title="Digite o seu CPF" aria-label="CPF do usuário">
</div>

<div class="mb-2">
<label for="email" class="form-label">E-mail: <span class="text-danger">*</span></label>
<input type="email" id="email" name="email" class="form-control"
placeholder="Digite o seu e-mail." required title="Digite o seu e-mail" aria-label="Endereço de e-mail">
</div>

<div class="mb-2">
<label for="confirmar-email" class="form-label">Repetir E-mail: <span class="text-danger">*</span></label>
<input type="email" id="confirmar-email" name="confirmar-email" class="form-control"
placeholder="Repita o seu e-mail para confirmar." required title="Repita o seu e-mail" aria-label="Confirmar endereço de e-mail">
</div>

<div class="mb-2">
<label for="senha" class="form-label">Senha: <span class="text-danger">*</span></label>
<input type="password" id="senha" name="senha" class="form-control"
placeholder="Digite a sua senha." required title="Digite a sua senha" aria-label="Senha">
</div>

<div class="mb-2">
<label for="confirmar-senha" class="form-label">Repetir Senha: <span class="text-danger">*</span></label>
<input type="password" id="confirmar-senha" name="confirmar-senha" class="form-control"
placeholder="Repita a sua senha para confirmar." required title="Repita a sua senha" aria-label="Confirmar senha">
</div>

<!-- Link login -->
<div class="esqueceu-senha text-end mb-2">
<a href="../pages/login.html" title="Ir para página de login" aria-label="Já possui conta? Entrar">Já tem conta? Entrar</a>
</div>

<!-- Botão enviar -->
<button type="submit" class="btn w-100" title="Cadastrar conta" aria-label="Cadastrar uma nova conta">Cadastrar uma Conta</button>
</form>
</div>
</section>

<!-- VLibras -->
<div vw class="enabled">
<div vw-access-button class="active"></div>
<div vw-plugin-wrapper>
<div class="vw-plugin-top-wrapper"></div>
</div>
</div>
</main>

<!-- Script modo escuro -->
<script src="../js/modo-escuro.js"></script>
<script src="../js/validacao-auth.js"></script>
<script src="../js/font-size.js"></script>

<!-- VLibras -->
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
</body>
</html>
